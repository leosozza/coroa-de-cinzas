<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tripo x Meshy</title>
<style>
:root{--bg:#14110d;--fg:#f1e7d0;--mut:#a89a7c;--acc:#d6a842}
body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
header{padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 8px}
.cell{position:relative;background:#1d1912;border-radius:8px;overflow:hidden}
.cell canvas{display:block;width:100%;height:60vh}
.tag{position:absolute;top:8px;left:10px;font-weight:600;color:var(--acc)}
.clips{position:absolute;bottom:8px;left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap}
button{background:#2a2419;color:var(--fg);border:1px solid #4a3f2c;border-radius:6px;padding:5px 9px;cursor:pointer}
button.on{background:var(--acc);color:#14110d}
small{color:var(--mut)}
</style></head><body>
<header><h1>Peão: espada presa à mão</h1><small>mesma arte-conceito · arraste para girar</small></header>
<div class="row" style="grid-template-columns:1fr 1fr"><div class="cell" id="tripo"><span class="tag">Meshy</span><div class="clips"></div></div>
<div class="cell" id="combo"><span class="tag">Corrigido (Blender)</span><div class="clips"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
window.__cmp = {};
function view(id, files, opt){
  const el = document.getElementById(id), r = new THREE.WebGLRenderer({antialias:true});
  r.setPixelRatio(Math.min(devicePixelRatio,2)); r.outputEncoding = THREE.sRGBEncoding;
  el.prepend(r.domElement);
  const sc = new THREE.Scene(); sc.background = new THREE.Color(0x1d1912);
  sc.add(new THREE.HemisphereLight(0xfff4e0, 0x302820, 1.1));
  const d = new THREE.DirectionalLight(0xffffff, 1.2); d.position.set(2,4,3); sc.add(d);
  const g = new THREE.Mesh(new THREE.CircleGeometry(1.2,48), new THREE.MeshStandardMaterial({color:0x3a3226}));
  g.rotation.x = -Math.PI/2; sc.add(g);
  const cam = new THREE.PerspectiveCamera(35, 1, 0.05, 50); cam.position.set(0,1.1,3.6);
  const oc = new THREE.OrbitControls(cam, r.domElement); oc.target.set(0,0.8,0); oc.update();
  const mix = { m:null, clips:[], act:null }, L = new THREE.GLTFLoader(), bar = el.querySelector('.clips');
  let root = null;
  function addClips(list){
    for (const c of list){
      mix.clips.push(c);
      const b = document.createElement('button'); b.textContent = c.name; b.onclick = () => play(c.name); bar.append(b);
    }
  }
  function play(name){
    const c = mix.clips.find(x => x.name === name); if (!c || !mix.m) return;
    if (mix.act) mix.act.stop();
    mix.act = mix.m.clipAction(c); mix.act.reset().play();
    bar.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.textContent === name));
  }
  L.load(files[0], gl => {
    root = gl.scene;
    root.scale.setScalar(opt.scale); root.rotation.y = opt.rotY || 0;
    sc.add(root); mix.m = new THREE.AnimationMixer(root); addClips(gl.animations);
    for (const f of files.slice(1)) L.load(f, g2 => addClips(g2.animations));
    const idle = gl.animations.find(a => /idle/i.test(a.name)); if (idle) play(idle.name);
  });
  const clock = new THREE.Clock();
  function size(){ const w = el.clientWidth, hh = el.querySelector('canvas').clientHeight || 400; r.setSize(w, hh, false); cam.aspect = w / hh; cam.updateProjectionMatrix(); }
  addEventListener('resize', size); setTimeout(size, 0);
  (function loop(){ requestAnimationFrame(loop); const dt = clock.getDelta(); if (mix.m) mix.m.update(dt); r.render(sc, cam); })();
  window.__cmp[id] = { play, seek:(t)=>{ if(mix.act){ mix.act.time=t; mix.m.update(0); r.render(sc,cam);} }, clips:()=>mix.clips.map(c=>c.name+' '+c.duration.toFixed(1)+'s') };
}
const Q=new URLSearchParams(location.search); const GP='../assets/meshy/peao/golpes.glb';
view('tripo', [Q.get('a')||'../assets/meshy/peao/animated.glb', GP], {scale:1});
view('combo', [Q.get('b')||'../assets/meshy/peao/animated.glb', GP], {scale:1});
</script></body></html>
